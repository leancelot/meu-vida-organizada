name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Compilar Web App (Vite)
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.APP_URL || '' }}

      - name: Inicializar e sincronizar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: VidaOrganizada-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
