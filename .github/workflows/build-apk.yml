name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Aceitar licenças do Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Web App (Vite)
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.APP_URL || '' }}

      - name: Sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK com Gradle
        run: |
          cd android
          # Corrige possíveis quebras de linha CRLF do Windows no script gradlew
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew
          # Aponta explicitamente para o SDK Android do runner
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: VidaOrganizada-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
