<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="VidaOrganizada - Gestor Pessoal" />
    <meta property="og:description" content="Aplicativo de organização pessoal com gestão de tarefas diárias, finanças, sincronização no Google Drive e integração com Google Agenda." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VidaOrganizada" />
    <meta name="theme-color" content="#1C1715" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        if (window.location.hash && window.location.hash.indexOf('access_token=') !== -1) {
          // Se carregado em navegador externo mobile durante o fluxo de autenticação
          if (/Android|iPhone|iPad/i.test(navigator.userAgent) && !window.Capacitor?.isNativePlatform?.()) {
            var deepLink = 'com.vidaorganizada.app://oauth' + window.location.hash;
            window.location.href = deepLink;
          }
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
