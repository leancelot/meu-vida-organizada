<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>VidaOrganizada - Conectando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #27272a;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 10px; color: #fff; }
    p { font-size: 0.875rem; color: #a1a1aa; margin: 0 0 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Conectando Conta Google</h1>
    <p>Retornando para o aplicativo VidaOrganizada com sua sincronização ativa...</p>
    <a id="open-btn" class="btn" href="#">Voltar para o App</a>
  </div>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var payload = hash || (search ? '#' + search.substring(1) : '');
      var deepLink = 'com.vidaorganizada.app://oauth' + payload;

      var btn = document.getElementById('open-btn');
      btn.href = deepLink;

      // Dispara o redirecionamento para o app nativo
      setTimeout(function() {
        window.location.href = deepLink;
      }, 350);
    })();
  </script>
</body>
</html>
